<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="KAMERLIFE — vie quotidienne dans une ville inspirée de Yaoundé." />
    <meta name="theme-color" content="#10251e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kamerlife" />
    <meta name="application-name" content="KAMERLIFE" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>KAMERLIFE</title>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: grid;
        place-items: center;
        background: #0b1218;
        color: #f2f4f7;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        transition: opacity 0.4s ease;
      }
      #boot.boot-done { opacity: 0; pointer-events: none; }
      #boot.boot-gone { display: none; }
      #boot-card { width: min(360px, 88vw); text-align: center; }
      #boot-mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 16px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #d4a84b, #8a5a22);
        color: #14110c;
        font-weight: 800;
        font-size: 32px;
      }
      #boot h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0.14em;
        font-weight: 800;
      }
      #boot-status { margin: 14px 0 0; color: #b7c4ce; font-size: 14px; }
      #boot-note {
        margin: 8px 0 0;
        color: #8ea0ad;
        font-size: 12px;
        line-height: 1.4;
        word-break: break-word;
      }
      #boot-track {
        margin: 18px auto 0;
        height: 4px;
        width: 100%;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      #boot-fill {
        display: block;
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #d4a84b, #8a5a22);
      }
      #boot button {
        margin-top: 18px;
        min-height: 44px;
        padding: 0 18px;
        border: 0;
        border-radius: 999px;
        background: #d4a84b;
        color: #14110c;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div id="boot-card">
        <div id="boot-mark" aria-hidden="true">K</div>
        <h1>KAMERLIFE</h1>
        <p id="boot-status">Ouverture…</p>
        <p id="boot-note"></p>
        <div id="boot-track"><i id="boot-fill"></i></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
